<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Open Shadowverse</title>

<script>
// 嘗試開啟 Shadowverse
setTimeout(function() {
    window.location.href = "shadowverse://";
}, 100);

// 如果失敗（沒裝），跳 App Store
setTimeout(function() {
    window.location.href = "https://apps.apple.com/";
}, 2000);
</script>

</head>
<body>
<p>Opening Shadowverse...</p>
</body>
</html>
